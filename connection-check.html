<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网站加载检测</title><style>body{font:17px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:#fff;color:#000;margin:24px auto;padding:0 20px;max-width:650px}h1{font-size:24px}li{margin:24px 0;overflow-wrap:anywhere}small{display:block;font-size:13px}button{font:inherit;padding:8px 15px;background:#fff;color:#000;border:1px solid #000}img{max-width:130px;max-height:160px;display:block;margin-top:10px}#summary{font-weight:700}</style><h1>网站加载检测</h1><p>请等待约 12 秒，再把这页结果截图发我。</p><p id="summary">正在检查…</p><ol id="results"></ol><button onclick="location.reload()">重新检测</button><script>
const tests=[['本网站首页',new URL('./?check='+Date.now(),location.href).href,false],['本网站小图片',new URL('assets/02-mobile.png?check='+Date.now(),location.href).href,true],['本网站照片',new URL('assets/photo-03.jpg?check='+Date.now(),location.href).href,true],['备用线路小图片','https://cdn.jsdelivr.net/gh/jmiochvjk-hub/woonhak-chongqing-2026@03779ab88c5d73990b6e09ef250a0671395889a1/assets/02-mobile.png',true]];
let done=0;
async function check([label,url,isImage]){const row=document.createElement('li');row.textContent=label+'：检查中';document.querySelector('#results').append(row);const start=performance.now(),controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(url,{signal:controller.signal,cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const blob=await response.blob();let image;if(isImage){image=new Image();const objectURL=URL.createObjectURL(blob);await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error('文件收到，但图片显示失败'));controller.signal.addEventListener('abort',()=>reject(Error('超时')),{once:true});image.src=objectURL});}row.textContent=label+'：成功（'+((performance.now()-start)/1000).toFixed(1)+'秒）';const info=document.createElement('small');info.textContent='收到 '+Math.round(blob.size/1024)+' KB'+(image?'，图片 '+image.naturalWidth+'×'+image.naturalHeight:'');row.append(info);if(image)row.append(image)}catch(error){row.textContent=label+'：'+(controller.signal.aborted?'12秒内未完成':error.message);row.style.color='#a00603'}finally{clearTimeout(timer);done++;if(done===tests.length)document.querySelector('#summary').textContent='检查完成，请截图这一页。'}}
tests.forEach(check);
</script></html>
